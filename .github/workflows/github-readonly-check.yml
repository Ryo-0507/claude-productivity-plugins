name: github-readonly-check

on:
  pull_request:
    paths:
      - plugins/github-readonly/**
      - .github/workflows/github-readonly-*
      - .claude-plugin/marketplace.json
  push:
    branches: [main]
    paths:
      - plugins/github-readonly/**
      - .github/workflows/github-readonly-*
      - .claude-plugin/marketplace.json

permissions:
  contents: read

jobs:
  github-readonly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: OS 別の zip をビルドする（公式のチェックサムとビルド来歴の証明を検証）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 plugins/github-readonly/tools/build.py build --out dist --verify-attestations

      - name: github-mcp-server が読み取り専用ツールだけを提供することを確認する
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 plugins/github-readonly/tools/build.py verify-readonly --verify-attestations

      - name: marketplace.json が指す zip の sha256 と中身を確認する
        run: python3 plugins/github-readonly/tools/build.py verify-marketplace
