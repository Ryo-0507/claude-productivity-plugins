name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['plugins/github-readonly--release_created'] }}
      tag_name: ${{ steps.release.outputs['plugins/github-readonly--tag_name'] }}
      version: ${{ steps.release.outputs['plugins/github-readonly--version'] }}
    steps:
      # GITHUB_TOKEN で作成・マージした PR やタグでは後続のワークフローが起動しないため、GitHub App のトークンを使う
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: リリース PR を自動マージする
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: OS 別の zip をビルドする
        run: python3 plugins/github-readonly/tools/build.py build --out dist --version "$VERSION"

      - name: zip をリリースに添付する
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"

      # zip の公開後に marketplace.json を更新する。GITHUB_TOKEN で push するため、このコミットではワークフローが再起動しない
      - name: marketplace.json を更新して main にコミットする
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python3 plugins/github-readonly/tools/build.py update-marketplace \
            --dist dist --repo "$GITHUB_REPOSITORY" --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore: publish ${TAG} to marketplace"
          git push origin main || (git pull --rebase origin main && git push origin main)
