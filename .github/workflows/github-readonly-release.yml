name: github-readonly-release

on:
  push:
    branches: [main]
    paths:
      - plugins/github-readonly/**

permissions:
  contents: read

concurrency:
  group: github-readonly-release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['plugins/github-readonly--release_created'] }}
      tag_name: ${{ steps.release.outputs['plugins/github-readonly--tag_name'] }}
      version: ${{ steps.release.outputs['plugins/github-readonly--version'] }}
    steps:
      # GITHUB_TOKEN で作成・マージした PR やタグでは後続のワークフローが起動しないため、GitHub App のトークンを使う
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: リリース PR を自動マージする
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: gh pr merge "$PR_NUMBER" --squash --repo "$GITHUB_REPOSITORY"

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: OS 別の zip をビルドする
        run: python3 plugins/github-readonly/tools/build.py build --out dist --version "$VERSION"

      - name: zip をリリースに添付する
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY"

      # marketplace.json の変更はメンテナーの承認を必須にするため、main へ直接 push せず PR を作る
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: marketplace.json を更新する PR を作る
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: marketplace/${{ needs.release-please.outputs.tag_name }}
        run: |
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          python3 plugins/github-readonly/tools/build.py update-marketplace \
            --dist dist --repo "$GITHUB_REPOSITORY" --tag "$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/marketplace.json
          git commit -m "chore(marketplace): publish ${TAG}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          python3 plugins/github-readonly/tools/build.py marketplace-pr-body \
            --dist dist --repo "$GITHUB_REPOSITORY" --tag "$TAG" > pr-body.md
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore(marketplace): publish ${TAG}" --body-file pr-body.md

      # 古いバージョンの PR を後からマージすると配信中のバージョンが巻き戻るため、新しい PR で置き換えたものは閉じる
      - name: 未マージの古い marketplace.json 更新 PR を閉じる
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: marketplace/${{ needs.release-please.outputs.tag_name }}
        run: |
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"marketplace/github-readonly-v\")) | select(.headRefName != \"${BRANCH}\") | .number" |
          while read -r number; do
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --delete-branch \
              --comment "新しいリリース ${TAG} の PR に置き換えたため閉じます。"
          done
